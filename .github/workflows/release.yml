name: Release

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and attach the release assets to"
        type: string
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - network: mainnet
            target: firefox
          - network: mainnet
            target: chrome
          - network: testnet
            target: chrome
          - network: testnet
            target: firefox
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for ${{ matrix.target }} ${{ matrix.network }}
        run: pnpm run build:${{ matrix.network }}:${{ matrix.target }}

      - name: Zip build
        run: |
          cd dist
          zip -r ../nautilus-${{ matrix.network }}-${{ matrix.target }}.zip .
          cd ..

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: "*.zip"

      - name: Upload Release Assets
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: "*.zip"

      - name: Upload Artifacts
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: nautilus-${{ matrix.network }}-${{ matrix.target }}
          path: "*.zip"
