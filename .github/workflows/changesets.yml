name: Changesets

on:
  push:
    branches:
      - master

concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version or tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      tag: v${{ fromJSON(steps.changesets.outputs.published-packages || '[{"version":""}]')[0].version }}
    steps:
      # Changesets decides which versions still need a tag by listing local tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release PR or tag
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset:version
          publish-script: pnpm changeset:tag
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  # Tags pushed with GITHUB_TOKEN don't trigger other workflows, so a tag trigger can't start this.
  release:
    name: Release
    needs: version
    if: needs.version.outputs.published == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
